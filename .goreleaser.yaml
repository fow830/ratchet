# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ratchet

before:
  hooks:
    - go mod tidy

builds:
  - id: ratchet
    main: ./cmd/ratchet
    binary: ratchet
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
  - id: tokensgen
    main: ./cmd/tokensgen
    binary: tokensgen
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

sboms:
  - artifacts: archive
    ids:
      - default

signs:
  - cmd: cosign
    env:
      - COSIGN_YES=true
    certificate: '${artifact}.pem'
    certificate-identity-regexp: '.*'
    certificate-oidc-issuer-regexp: '.*'
    artifacts: checksum
    args:
      - sign-blob
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - --yes
      - --bundle=${artifact}.sigstore.json
      - ${artifact}
    signature: '${artifact}.sig'

release:
  draft: false
  prerelease: auto
